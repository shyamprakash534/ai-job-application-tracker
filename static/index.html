<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JobOS — Smart Job Tracker</title>
<style>
:root{--bg:#f6f7fb;--panel:#fff;--text:#111827;--muted:#667085;--line:#e6e8ef;--accent:#4f46e5;--green:#087443;--red:#b42318;--amber:#b54708;--shadow:0 10px 30px #1018280d}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}.app{display:flex;min-height:100vh}.side{width:235px;background:#101828;color:#fff;padding:24px 16px;position:sticky;top:0;height:100vh}.brand{font-weight:800;font-size:20px;margin:0 10px 30px}.brand span{color:#a5b4fc}.nav button{width:100%;background:transparent;color:#d0d5dd;border:0;text-align:left;padding:11px 12px;border-radius:8px;margin:2px 0;cursor:pointer}.nav button.active,.nav button:hover{background:#ffffff14;color:#fff}.main{flex:1;min-width:0}.top{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px}.top h1{font-size:20px;margin:0}.container{max-width:1400px;margin:auto;padding:28px 32px}.actions{display:flex;gap:10px}.btn{border:1px solid var(--line);background:#fff;padding:10px 14px;border-radius:8px;cursor:pointer;font-weight:650}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}.card{padding:18px}.label{color:var(--muted);font-size:12px}.big{font-size:27px;font-weight:800;margin-top:4px}.sub{font-size:12px;color:var(--muted)}.toolbar{display:flex;gap:10px;align-items:center;margin-bottom:14px;flex-wrap:wrap}.search{flex:1;min-width:220px}.input,.select,.textarea{width:100%;border:1px solid #d0d5dd;border-radius:8px;padding:10px;background:#fff;outline:none}.input:focus,.select:focus,.textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px #4f46e51a}.panel{overflow:hidden}.tablewrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:1000px}.table th,.table td{padding:14px 16px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}.table th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);background:#fafafa}.jobtitle{font-weight:750}.company{color:var(--muted);font-size:12px}.pill{display:inline-flex;align-items:center;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:700;background:#f2f4f7;color:#344054}.pill.green{background:#ecfdf3;color:var(--green)}.pill.red{background:#fef3f2;color:var(--red)}.pill.amber{background:#fffaeb;color:var(--amber)}.resume{font-size:12px;font-weight:650}.row{display:grid;grid-template-columns:1fr 1fr;gap:14px}.form{padding:22px}.form h2{margin:0 0 4px}.form p{margin:0 0 20px;color:var(--muted)}.field{margin-bottom:14px}.field label{display:block;font-size:12px;font-weight:700;margin-bottom:6px}.footer-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}.hidden{display:none!important}.empty{text-align:center;padding:55px;color:var(--muted)}.drawer{position:fixed;inset:0;background:#10182866;display:flex;justify-content:flex-end;z-index:10}.drawerbox{width:min(620px,100%);height:100%;background:#fff;padding:24px;overflow:auto}.close{float:right;border:0;background:#f2f4f7;border-radius:50%;width:34px;height:34px;cursor:pointer}.scoregrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0}.scorebox{border:1px solid var(--line);border-radius:10px;padding:13px}.scorebox strong{display:block;font-size:22px}.stop{background:#fef3f2;color:var(--red);padding:9px;border-radius:8px;margin-top:8px;font-size:12px}@media(max-width:900px){.side{display:none}.container{padding:20px}.cards{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}.top{padding:0 20px}}
</style></head><body><div class="app"><aside class="side"><div class="brand">Job<span>OS</span></div><div class="nav"><button class="active">Dashboard</button><button onclick="focusAdd()">Add Job</button><button onclick="alert('Resume profiles are fixed to your verified four-resume setup.')">Resume Profiles</button><button onclick="alert('Settings will be enabled in the next build.')">Settings</button></div><div style="position:absolute;bottom:20px;left:22px;right:22px;color:#98a2b3;font-size:11px">AI Job Application Tracker<br>v0.2 UI</div></aside><main class="main"><header class="top"><h1>Job dashboard</h1><div class="actions"><button class="btn" onclick="load()">Refresh</button><button class="btn primary" onclick="focusAdd()">+ Add job</button></div></header><div class="container"><section class="cards" id="stats"></section><div class="toolbar"><input id="search" class="input search" placeholder="Search company, role, skills…" oninput="render()"><select id="filter" class="select" style="width:180px" onchange="render()"><option value="ALL">All statuses</option><option>FOUND</option><option>SHORTLISTED</option><option>APPLIED</option><option>OA / TEST</option><option>INTERVIEW</option><option>OFFER</option><option>REJECTED</option><option>ACCEPTED</option></select><select id="resumeFilter" class="select" style="width:220px" onchange="render()"><option value="ALL">All resume matches</option><option>Data Analyst</option><option>AWS Cloud / Data Engineer</option><option>Backend / Platform Generalist</option><option>AI/ML / GenAI</option></select></div><section class="panel"><div class="tablewrap"><table class="table"><thead><tr><th>Job</th><th>Best resume</th><th>Match</th><th>Location</th><th>Status</th><th>Action</th></tr></thead><tbody id="jobs"></tbody></table></div></section><section class="panel form" id="addPanel" style="margin-top:22px"><h2>Add a job</h2><p>Paste a real job description. The matcher compares it against all four resume profiles.</p><form id="jobForm"><div class="row"><div class="field"><label>Company *</label><input class="input" name="company" required placeholder="e.g. Cognizant"></div><div class="field"><label>Job title *</label><input class="input" name="title" required placeholder="e.g. Python Developer"></div></div><div class="row"><div class="field"><label>Location</label><input class="input" name="location" placeholder="Hyderabad, Telangana"></div><div class="field"><label>Work model</label><select class="select" name="work_model"><option value="">Select</option><option>On-site</option><option>Hybrid</option><option>Remote</option></select></div></div><div class="row"><div class="field"><label>Posting date</label><input class="input" name="posting_date" placeholder="2026-09-15"></div><div class="field"><label>Source</label><select class="select" name="source"><option value="">Select source</option><option>Company Careers</option><option>LinkedIn</option><option>Naukri</option><option>Indeed</option><option>Foundit</option><option>Other</option></select></div></div><div class="row"><div class="field"><label>Application URL</label><input class="input" name="url" type="url" placeholder="https://..."></div><div class="field"><label>Initial status</label><select class="select" name="status"><option>FOUND</option><option>SHORTLISTED</option><option>APPLIED</option></select></div></div><div class="field"><label>Job description *</label><textarea class="textarea" name="description" required rows="8" placeholder="Paste the complete job description here…"></textarea></div><div class="footer-actions"><button type="reset" class="btn">Clear</button><button class="btn primary">Add & match</button></div></form></section></div></main></div><div id="drawer" class="drawer hidden" onclick="if(event.target===this)closeDrawer()"><div class="drawerbox"><button class="close" onclick="closeDrawer()">×</button><div id="drawerContent"></div></div></div><script>let jobs=[];const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));async function load(){jobs=await(await fetch('/api/jobs')).json();render()}function render(){const q=document.getElementById('search').value.toLowerCase(),f=document.getElementById('filter').value,rf=document.getElementById('resumeFilter').value;let filtered=jobs.filter(j=>(f==='ALL'||j.status===f)&&(rf==='ALL'||j.match.best_resume===rf)&&(`${j.company} ${j.title} ${j.description} ${j.location}`.toLowerCase().includes(q)));stats();document.getElementById('jobs').innerHTML=filtered.length?filtered.map(row).join(''):`<tr><td colspan="6"><div class="empty">No jobs match your filters.</div></td></tr>`}function stats(){let c={};jobs.forEach(j=>c[j.status]=(c[j.status]||0)+1);document.getElementById('stats').innerHTML=[['Total jobs',jobs.length,'All tracked jobs'],['Shortlisted',c.SHORTLISTED||0,'Ready to review'],['Applied',c.APPLIED||0,'Applications sent'],['Interviews',c.INTERVIEW||0,'Active opportunities']].map(x=>`<div class="card"><div class="label">${x[0]}</div><div class="big">${x[1]}</div><div class="sub">${x[2]}</div></div>`).join('')}function row(j){let score=j.match.best_score;let cls=score>=80?'green':score>=65?'amber':'red';return `<tr><td><div class="jobtitle">${esc(j.title)}</div><div class="company">${esc(j.company)}</div></td><td><span class="resume">${esc(j.match.best_resume)}</span></td><td><span class="pill ${cls}">${score}/100</span></td><td>${esc(j.location||'—')}<div class="company">${esc(j.work_model||'')}</div></td><td><select class="select" onchange="status(${j.id},this.value)" style="min-width:125px">${['FOUND','SHORTLISTED','APPLIED','OA / TEST','INTERVIEW','OFFER','REJECTED','ACCEPTED'].map(s=>`<option ${s===j.status?'selected':''}>${s}</option>`).join('')}</select></td><td><button class="btn" onclick="details(${j.id})">View</button></td></tr>`}async function status(id,s){await fetch(`/api/jobs/${id}/status?status=${encodeURIComponent(s)}`,{method:'PATCH'});await load()}function details(id){let j=jobs.find(x=>x.id===id),p=j.match.profiles;document.getElementById('drawerContent').innerHTML=`<div style="margin-top:45px"><div class="label">${esc(j.company)}</div><h2 style="margin:2px 0">${esc(j.title)}</h2><div class="company">${esc(j.location||'')} · ${esc(j.work_model||'')} · ${esc(j.posting_date||'')}</div><div class="scoregrid">${Object.entries(p).map(([k,v])=>`<div class="scorebox"><div class="label">${esc(k)}</div><strong>${v.score}/100</strong><div class="company">${v.skill_hits.slice(0,6).map(esc).join(' · ')||'No major skill hits'}</div></div>`).join('')}</div><h3>Recommended resume</h3><p><span class="pill green">${esc(j.match.best_resume)} · ${j.match.best_score}/100</span></p><h3>Eligibility flags</h3>${[...new Set(Object.values(p).flatMap(x=>x.hard_stops))].map(x=>`<div class="stop">${esc(x)}</div>`).join('')||'<p class="company">No hard-stop detected by the current matcher.</p>'}<h3>Application</h3>${j.url?`<a href="${esc(j.url)}" target="_blank" rel="noopener" class="btn primary" style="display:inline-block;text-decoration:none">Open application</a>`:'<p class="company">No application URL provided.</p>'}</div>`;document.getElementById('drawer').classList.remove('hidden')}function closeDrawer(){document.getElementById('drawer').classList.add('hidden')}function focusAdd(){document.getElementById('addPanel').scrollIntoView({behavior:'smooth'});setTimeout(()=>document.querySelector('[name=company]').focus(),400)}document.getElementById('jobForm').onsubmit=async e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));let r=await fetch('/api/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});if(!r.ok){alert('Could not add job. Check the fields.');return}e.target.reset();await load();document.getElementById('addPanel').scrollIntoView({behavior:'smooth'})};load();</script></body></html>
