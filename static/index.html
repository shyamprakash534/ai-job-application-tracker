<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JobMatch AI</title><style>body{font-family:Inter,system-ui;margin:0;background:#f6f7fb;color:#101828}main{max-width:1100px;margin:auto;padding:40px 20px}.hero{text-align:center;padding:35px 0}.hero h1{font-size:42px;margin:0 0 10px}.hero p{color:#667085;font-size:18px}.panel{background:#fff;border:1px solid #e4e7ec;border-radius:18px;padding:24px;margin:18px 0;box-shadow:0 8px 30px #1018280d}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field{margin:14px 0}.field label{font-weight:700;display:block;margin-bottom:7px}.input,textarea,select{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:10px;box-sizing:border-box}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{background:#eef4ff;padding:7px 10px;border-radius:999px}.btn{border:0;border-radius:10px;padding:12px 18px;font-weight:750;cursor:pointer}.primary{background:#4f46e5;color:white}.muted{color:#667085}.results{display:grid;gap:14px}.job{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:18px}.top{display:flex;justify-content:space-between;gap:15px}.score{font-size:24px;font-weight:850}.green{color:#067647}.amber{color:#b54708}.red{color:#b42318}.meta{color:#667085;margin:6px 0 12px}.small{font-size:13px}.apply{display:inline-block;text-decoration:none;margin-top:14px}.hidden{display:none}.error{color:#b42318;background:#fef3f2;padding:10px;border-radius:8px}.loading{text-align:center;padding:25px}@media(max-width:750px){.grid{grid-template-columns:1fr}.hero h1{font-size:32px}.top{flex-direction:column;align-items:flex-start}}</style></head><body><main><section class="hero"><h1>🎯 JobMatch AI</h1><p>Upload your resume, add your skills and choose where you want to work. We'll find and rank jobs for you.</p></section><section class="panel"><h2>Your profile</h2><div class="grid"><div><div class="field"><label>Resume (PDF or DOCX)</label><input id="resume" type="file" accept=".pdf,.docx"></div><div id="resumeStatus" class="muted small"></div></div><div><div class="field"><label>Additional skills</label><input id="skills" class="input" placeholder="Python, SQL, AWS, Machine Learning"></div><div class="field"><label>Preferred locations</label><input id="locations" class="input" placeholder="Hyderabad, Bengaluru, Remote"></div></div></div><div class="grid"><div class="field"><label>Preferred job roles (optional)</label><input id="roles" class="input" placeholder="Python Developer, Data Analyst"></div><div class="field"><label>Work model (optional)</label><select id="modes" multiple size="3"><option>Remote</option><option>Hybrid</option><option>On-site</option></select></div></div><button id="find" class="btn primary">Find Matching Jobs 🚀</button><div id="error"></div></section><section id="resultsPanel" class="panel hidden"><div class="top"><div><h2 id="count">Matching jobs</h2><div class="muted">Ranked by resume, skills, location and eligibility.</div></div></div><div id="results" class="results"></div></section></main><script>let resumeText='';let detected=[];const $=id=>document.getElementById(id);$('resume').onchange=async()=>{const f=$('resume').files[0];if(!f)return;let fd=new FormData();fd.append('file',f);$('resumeStatus').textContent='Reading resume…';let r=await fetch('/api/resume/parse',{method:'POST',body:fd});let d=await r.json();if(!r.ok){$('resumeStatus').textContent='';$('error').innerHTML='<div class="error">'+(d.detail||'Could not read resume')+'</div>';return}resumeText=d.text;detected=d.skills;$('resumeStatus').textContent='✓ Resume read. Detected skills: '+detected.join(', ')};$('find').onclick=async()=>{ $('error').innerHTML='';if(!resumeText&&!$('skills').value.trim()){ $('error').innerHTML='<div class="error">Upload a resume or enter at least one skill.</div>';return}let payload={resume_text:resumeText,skills:$('skills').value.split(',').map(x=>x.trim()).filter(Boolean),locations:$('locations').value.split(',').map(x=>x.trim()).filter(Boolean),roles:$('roles').value.split(',').map(x=>x.trim()).filter(Boolean),work_modes:[...$('modes').selectedOptions].map(x=>x.value)};$('resultsPanel').classList.remove('hidden');$('results').innerHTML='<div class="loading">🔎 Searching and matching jobs…</div>';let r=await fetch('/api/match-jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});let d=await r.json();if(!r.ok){$('results').innerHTML='<div class="error">'+(d.detail||'Search failed')+'</div>';return}$('count').textContent=d.count+' matching jobs found';$('results').innerHTML=d.jobs.map(j=>{let s=j.match.score,c=s>=80?'green':s>=60?'amber':'red';return `<article class="job"><div class="top"><div><h3>${esc(j.title)}</h3><div><b>${esc(j.company)}</b></div><div class="meta">📍 ${esc(j.location||'Remote')} · ${esc(j.work_model||'')} · ${esc(j.source)}</div></div><div class="score ${c}">${s}%</div></div><div class="small"><b>Matched skills:</b> ${j.match.matched_skills.length?j.match.matched_skills.map(x=>`<span class="chip">${esc(x)}</span>`).join(' '):'None detected'}</div><div class="small" style="margin-top:9px"><b>Missing:</b> ${j.match.missing_skills.slice(0,8).join(', ')||'None detected'}</div>${j.match.hard_stops.map(x=>`<div class="error small" style="margin-top:9px">⚠️ ${esc(x)}</div>`).join('')}<a class="btn primary apply" href="${esc(j.url)}" target="_blank" rel="noopener">View & Apply ↗</a></article>`}).join('')||'<div class="loading">No matching jobs found. Try broader locations or skills.</div>'};function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}</script></body></html>
